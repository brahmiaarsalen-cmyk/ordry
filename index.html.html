<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طاولة · اطلب وما تستناش</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== التصميم (CSS): الألوان والخطوط وشكل كل عنصر ===== */
/* :root = الألوان: --red أحمر غامق، --gold ذهبي، --white أبيض، --ivory خلفية فاتحة */
:root{--red:#6B0F1A;--red2:#4A0912;--red3:#8A1A28;--gold:#C9A24B;--gold2:#E6C879;--white:#FFFFFF;--ivory:#FBF7F1;--ink:#2A0A0E;--mute:#8B6B6F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--red2);font-family:'Tajawal',Tahoma,sans-serif;color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100%;background:var(--ivory);display:flex;flex-direction:column;position:relative;overflow:hidden}
header{background:var(--red);color:var(--white);padding:18px 20px 16px;border-bottom:3px solid var(--gold)}
header h1{font-family:'Reem Kufi',serif;font-size:26px;color:var(--gold2);letter-spacing:.5px}
header p{font-size:13px;opacity:.85;margin-top:2px}
main{flex:1;overflow-y:auto;padding:16px 16px 90px}
nav{display:flex;background:var(--white);border-top:1px solid #eadfd0}
nav button{flex:1;padding:12px 4px 10px;border:0;background:none;font:500 14px 'Tajawal',sans-serif;color:var(--mute);cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--red);border-top-color:var(--gold);font-weight:700}
nav button:focus-visible,.btn:focus-visible,.chip:focus-visible,.q:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{background:var(--red);color:var(--white);border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid var(--gold)}
.hero b{font-family:'Reem Kufi',serif;font-size:20px;color:var(--gold2);display:block}
.hero span{font-size:13px;opacity:.9}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.chip{border:1px solid var(--gold);background:var(--white);color:var(--red);padding:6px 14px;border-radius:20px;font:500 14px 'Tajawal',sans-serif;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--red);color:var(--gold2)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--white);border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid #eadfd0}
.item h3{font-size:16px;color:var(--red)}
.item p{font-size:13px;color:var(--mute);margin:2px 0 4px}
.price{font-weight:700;color:var(--gold);font-size:15px;filter:brightness(.8)}
.qty{display:flex;align-items:center;gap:10px}
.q{width:32px;height:32px;border-radius:50%;border:1px solid var(--red);background:var(--white);color:var(--red);font-size:18px;cursor:pointer}
.q.add{background:var(--red);color:var(--gold2)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--red);color:var(--gold2);font:700 16px 'Tajawal',sans-serif;cursor:pointer;border-bottom:3px solid var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{position:absolute;bottom:62px;inset-inline:12px;display:none}
.bar.show{display:block}
h2{font-family:'Reem Kufi',serif;color:var(--red);font-size:22px;margin-bottom:12px}
.steps{background:var(--white);border-radius:12px;padding:8px 16px;border:1px solid #eadfd0;margin-bottom:14px}
.step{display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--mute)}
.step+.step{border-top:1px dashed #e4d6c2}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid #d9c9b0;flex:none}
.step.done{color:var(--ink)}.step.done .dot{background:var(--gold);border-color:var(--gold)}
.step.now .dot{border-color:var(--red);background:var(--red3);animation:p 1.2s infinite}
@keyframes p{50%{box-shadow:0 0 0 6px rgba(138,26,40,.2)}}
@media(prefers-reduced-motion:reduce){.step.now .dot{animation:none}}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.total{font-weight:700;color:var(--red);border-top:1px solid #eadfd0;margin-top:6px;padding-top:10px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
label{display:block;font-weight:700;color:var(--red);margin:14px 0 8px;font-size:15px}
input[type=date]{width:100%;padding:12px;border:1px solid var(--gold);border-radius:10px;font:16px 'Tajawal',sans-serif;background:var(--white)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times .chip{text-align:center;padding:9px 0}
.guests{display:flex;align-items:center;gap:18px}
.guests b{font-size:22px;color:var(--red);min-width:28px;text-align:center}
.toast{position:absolute;top:12px;inset-inline:12px;background:var(--white);border:2px solid var(--gold);border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(74,9,18,.35);transform:translateY(-140%);transition:transform .35s;z-index:5;display:flex;gap:12px;align-items:center}
.toast.show{transform:none}
.toast i{font-style:normal;background:var(--red);color:var(--gold2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.toast b{color:var(--red);display:block}.toast span{font-size:13px;color:var(--mute)}
.ok{background:var(--red);color:var(--white);border-radius:14px;padding:20px;text-align:center;border:1px solid var(--gold)}
.ok b{display:block;font-family:'Reem Kufi',serif;color:var(--gold2);font-size:22px;margin-bottom:6px}
.rc{background:var(--white);border-radius:14px;margin-bottom:14px;border:1px solid #eadfd0;overflow:hidden;cursor:pointer;display:block;width:100%;text-align:inherit;padding:0;font:inherit;color:inherit}
.rc svg,.gal svg,.item svg{display:block}
.rc .in{padding:10px 14px 12px}.rc h3{font-family:'Reem Kufi',serif;color:var(--red);font-size:19px}
.rc p{font-size:13px;color:var(--mute)}.tag{display:inline-block;margin-top:6px;font-size:12px;color:var(--red);border:1px solid var(--gold);border-radius:10px;padding:1px 8px}
.gal{display:flex;gap:8px;overflow-x:auto;margin-bottom:6px}.gal>div{flex:0 0 86%;position:relative}.gal svg{border-radius:12px;width:100%;height:auto}
.gal em{position:absolute;bottom:8px;inset-inline-start:8px;background:var(--red);color:var(--gold2);font-style:normal;font-size:12px;padding:2px 10px;border-radius:10px}
.back{border:0;background:none;color:var(--red);font:700 15px 'Tajawal',sans-serif;cursor:pointer;margin-bottom:8px;padding:4px 0}
.item svg{width:78px;height:78px;border-radius:50%;flex:none}.item .t{flex:1}.item .qty{flex-direction:column}
.gal img,.rc img{display:block;width:100%;aspect-ratio:5/3;object-fit:cover;border-radius:12px}.rc img{border-radius:0}.item img{width:78px;height:78px;border-radius:50%;object-fit:cover;flex:none;display:block}.ph{text-align:center;flex:none}.up{display:inline-block;background:var(--gold);color:var(--red2);font:700 12px 'Tajawal',sans-serif;padding:4px 10px;border-radius:10px;cursor:pointer;margin-top:4px}.gal .up{position:absolute;top:8px;inset-inline-end:8px;margin:0}
select{width:100%;padding:12px;border:1px solid var(--gold);border-radius:10px;font:16px 'Tajawal',sans-serif;background:var(--white)}
</style>
</head>
<body>
<!-- ===== هيكل الصفحة (HTML): إطار التطبيق بحجم تلفون ===== -->
<!-- app = الإطار العام، toast = إشعار "طلبك جاهز"، header = العنوان، main = المحتوى اللي يتبدل، bar = زر تثبيت الطلب، nav = الأزرار السفلية (المطاعم، طلبي، حجز) -->
<div class="app">
  <div class="toast" id="toast" role="alert"><i>✓</i><div><b>طلبك جاهز!</b><span>تفضل اخذو من المطعم متاعنا، الأكل سخون.</span></div></div>
  <header><h1>طاولة</h1><p>اطلب من التطبيق وما تستناش</p></header>
  <main id="main"></main>
  <div class="bar" id="bar"><button class="btn" id="go"></button></div>
  <nav>
    <button data-t="home" class="on">المطاعم</button>
    <button data-t="order">طلبي</button>
    <button data-t="book">حجز طاولة</button>
  </nav>
</div>
<script>
// ===== المنطق (JavaScript): كل اللي يخلي التطبيق يخدم =====
// 1) البيانات: قائمة المطاعم، وكل مطعم فيه الأكلات (الاسم، الوصف، السعر، نوع الصورة)
const R=[
{id:'y',n:'مطعم الياسمين',k:'مطبخ تونسي',col:'#8A1A28',t:'25 د',m:[
{n:'كسكسي بالعلوش',d:'لحم الغنم والخضرة',p:18,i:'cous'},{n:'ملوخية بالبقري',d:'طبخة بطيئة تقليدية',p:20,i:'molo'},{n:'بريك بالتن والبيض',d:'مقرمشة وسخونة',p:4,i:'brik'},{n:'سلطة مشوية',d:'فلفل وطماطم بزيت الزيتون',p:7,i:'sal'},{n:'عصيدة زقوقو',d:'بالزقوقو والمكسرات',p:9,i:'des'}]},
{id:'b',n:'البحر الأزرق',k:'أسماك ومأكولات بحرية',col:'#1F4E6B',t:'30 د',m:[
{n:'دراد مشوي',d:'سمك طازج بالليمون',p:28,i:'fish'},{n:'ماقرونة بالقمبري',d:'صلصة طماطم وحريسة خفيفة',p:22,i:'pasta'},{n:'شوربة الحوت',d:'بالخضرة والتوابل',p:12,i:'molo'},{n:'سلطة البحر',d:'تن وزيتون وخضرة',p:10,i:'sal'}]},
{id:'z',n:'دار الزيتونة',k:'بيتزا وبرغر',col:'#4F6B2A',t:'20 د',m:[
{n:'بيتزا مرغريتا',d:'جبن وطماطم وريحان',p:15,i:'pizza'},{n:'برغر الدار',d:'لحم بقري وجبن وخضرة',p:16,i:'burg'},{n:'ماقرونة بولونيز',d:'صلصة اللحم المفروم',p:14,i:'pasta'},{n:'شاي بالصنوبر',d:'شاي أخضر ونعناع',p:5,i:'tea'}]}
];
// 2) الصور المرسومة: دوال ترسم صورة مطعم من برّة، من الداخل، وصورة كل أكلة (SVG) كبديل مؤقت للصور الحقيقية
const G='#C9A24B',W='#FFFFFF';
const svg=(w,h,x)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${x}</svg>`;
function outside(r){let st='';for(let i=0;i<8;i++)st+=`<rect x="${50+i*37.5}" y="92" width="37.5" height="26" fill="${i%2?W:r.col}"/>`;
return svg(300,180,`<rect width="300" height="180" fill="#E9DCC6"/><rect y="150" width="300" height="30" fill="#6b6460"/><rect x="40" y="55" width="220" height="97" fill="#F3E7D3"/><rect x="40" y="40" width="220" height="20" fill="${r.col}"/><rect x="80" y="43" width="140" height="14" rx="3" fill="${G}"/><text x="150" y="54" font-size="11" text-anchor="middle" fill="#3b0710" font-weight="700">${r.n}</text>${st}<rect x="130" y="118" width="40" height="34" fill="#3b0710"/><circle cx="163" cy="136" r="2" fill="${G}"/><rect x="55" y="124" width="60" height="28" fill="#CFE3EA"/><rect x="185" y="124" width="60" height="28" fill="#CFE3EA"/><circle cx="25" cy="140" r="12" fill="#5C7A3A"/><rect x="23" y="146" width="4" height="10" fill="#4a3320"/>`)}
function inside(r){let t='';[60,150,240].forEach(x=>t+=`<line x1="${x}" y1="0" x2="${x}" y2="40" stroke="${G}"/><path d="M${x-16} 56 L${x-8} 40 H${x+8} L${x+16} 56Z" fill="${G}"/><ellipse cx="${x}" cy="125" rx="30" ry="9" fill="#7a4a2a"/><rect x="${x-2}" y="125" width="4" height="28" fill="#5a3418"/><rect x="${x-26}" y="139" width="8" height="18" rx="2" fill="${r.col}"/><rect x="${x+18}" y="139" width="8" height="18" rx="2" fill="${r.col}"/><circle cx="${x}" cy="119" r="4" fill="${W}"/>`);
return svg(300,180,`<rect width="300" height="180" fill="${r.col}"/><rect y="120" width="300" height="60" fill="#3b0710"/><rect x="20" y="62" width="40" height="40" fill="#F3E7D3" opacity=".85"/><rect x="240" y="62" width="40" height="40" fill="#F3E7D3" opacity=".85"/>${t}`)}
const D={cous:'#E8C468',molo:'#2F5A2A',brik:'#D9902F',sal:'#C8372D',des:'#F3E7D3',fish:'#B9C4C9',pasta:'#D8552E',pizza:'#E5B454',burg:'#9A5B2C',tea:'#7DAA5A'};
function dish(k){const c=D[k];let f='';
if(k=='brik')f=`<path d="M22 56 Q50 18 78 56Z" fill="${c}" stroke="#a96a1c" stroke-width="3"/>`;
else if(k=='tea')f=`<rect x="36" y="34" width="28" height="34" rx="4" fill="${c}" opacity=".85"/><rect x="36" y="30" width="28" height="5" fill="${G}"/>`;
else if(k=='fish')f=`<ellipse cx="48" cy="50" rx="24" ry="11" fill="${c}"/><path d="M70 50 L84 40 V60Z" fill="${c}"/><circle cx="35" cy="47" r="2" fill="#333"/><circle cx="52" cy="32" r="5" fill="#E8C468"/>`;
else if(k=='burg')f=`<ellipse cx="50" cy="38" rx="26" ry="12" fill="#D9902F"/><rect x="24" y="44" width="52" height="7" rx="3" fill="#5C7A3A"/><rect x="24" y="51" width="52" height="8" rx="3" fill="${c}"/><ellipse cx="50" cy="63" rx="26" ry="8" fill="#D9902F"/>`;
else if(k=='pizza')f=`<circle cx="50" cy="50" r="28" fill="${c}"/>`+[[40,42],[60,45],[48,62],[62,60],[38,58]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#B3261E"/>`).join('');
else if(k=='pasta')f=`<circle cx="50" cy="50" r="26" fill="#EFD58C"/><path d="M30 50 Q50 28 70 50 Q50 72 30 50 M36 50 Q50 38 64 50" stroke="${c}" stroke-width="5" fill="none"/>`;
else if(k=='sal')f=`<circle cx="50" cy="50" r="26" fill="#6E9B3F"/>`+[[40,44],[58,40],[52,58],[38,58],[64,54]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${c}"/>`).join('');
else if(k=='des')f=`<circle cx="50" cy="50" r="24" fill="${c}"/><circle cx="50" cy="50" r="12" fill="#E3C79A"/>`+[[38,38],[62,40],[60,62],[40,62]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#8a5a2b"/>`).join('');
else f=`<ellipse cx="50" cy="52" rx="28" ry="20" fill="${c}"/>`+[[38,46],[56,42],[62,56],[44,60]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${k=='cous'?'#8A1A28':'#8bbf5a'}"/>`).join('');
return svg(100,100,`<rect width="100" height="100" fill="#F7EEDD"/><circle cx="50" cy="50" r="44" fill="${W}" stroke="${G}" stroke-width="3"/>${f}`)}
// 3) تعديل الصور: P = الصور اللي رفعها المستخدم (محفوظة في المتصفح)، pic = تعرض الصورة المرفوعة وإلا الرسمة
//    up = زر "زيد صورة"، shrink = تصغّر الصورة قبل الحفظ
let P={};try{P=JSON.parse(localStorage.getItem('ph')||'{}')}catch(e){}
let edit=false;
const pic=(k,s,c)=>P[k]?`<img src="${P[k]}" alt="" class="${c||''}">`:s;
const up=k=>edit?`<label class="up">📷 ${P[k]?'بدّل الصورة':'زيد صورة'}<input type="file" accept="image/*" hidden data-k="${k}"></label>`:'';
function shrink(f,k){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);P[k]=c.toDataURL('image/jpeg',.72);try{localStorage.setItem('ph',JSON.stringify(P))}catch(x){}render()};im.src=fr.result};fr.readAsDataURL(f)}
// 4) الحالة: tab = الصفحة الحالية، rid = المطعم المختار، cart = السلة، order = الطلب الحالي، book = بيانات الحجز
let tab='home',rid=null,cart={},order=null,timers=[],book={rid:'y',date:'',time:'',guests:2,done:false};
const $=s=>document.querySelector(s),cur=()=>R.find(r=>r.id===rid);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sum=()=>cur()?cur().m.reduce((a,m,i)=>a+(cart[i]||0)*m.p,0):0;
// 5) render: ترسم الشاشة حسب الحالة: قائمة المطاعم، صفحة مطعم (الصور + الأكلات)، متابعة الطلب، أو الحجز
function render(){
 const m=$('#main');
 if(tab==='home'&&!rid){m.innerHTML=`<div class="hero"><b>اختار مطعمك</b><span>اطلب من التطبيق، ونبعثولك إشعار كي يكون الأكل جاهز.</span></div>`+R.map(r=>`<button class="rc" data-r="${r.id}">${pic(r.id+':o',outside(r))}<div class="in"><h3>${r.n}</h3><p>${r.k}</p><span class="tag">تحضير في ${r.t}</span></div></button>`).join('');}
 else if(tab==='home'){const r=cur();m.innerHTML=`<button class="back" data-back="1">← كل المطاعم</button><button class="chip" data-edit="1" style="float:left">${edit?'تم':'تعديل الصور'}</button><h2>${r.n}</h2><div class="gal"><div>${pic(r.id+':o',outside(r))}<em>من برّة</em>${up(r.id+':o')}</div><div>${pic(r.id+':i',inside(r))}<em>من الداخل</em>${up(r.id+':i')}</div></div><p style="font-size:13px;color:var(--mute);margin:6px 0 14px">${r.k} · تحضير في ${r.t}</p>`+r.m.map((i,x)=>`<div class="item"><div class="ph">${pic(r.id+':d'+x,dish(i.i))}${up(r.id+':d'+x)}</div><div class="t"><h3>${i.n}</h3><p>${i.d}</p><span class="price">${i.p} د.ت</span></div><div class="qty"><button class="q add" data-a="${x}" aria-label="زيد">+</button>${cart[x]?`<b>${cart[x]}</b><button class="q" data-m="${x}" aria-label="نقص">−</button>`:''}</div></div>`).join('');}
 else if(tab==='order'){
  if(!order)m.innerHTML=`<h2>طلبي</h2><div class="empty">ما عندكش طلب حاليا.<br>اختار مطعم وابدا.</div>`;
  else{const S=['تم الاستلام','قيد التحضير','جاهز للاستلام'];m.innerHTML=`<h2>طلب رقم ${order.no}</h2><p style="color:var(--mute);margin:-6px 0 12px">${order.rn}</p><div class="steps">${S.map((s,i)=>`<div class="step ${i<order.st?'done':i===order.st?'now':''}"><span class="dot"></span>${s}</div>`).join('')}</div><div class="steps">${order.lines.map(l=>`<div class="row"><span>${l[1]} × ${l[0]}</span><span>${l[2]} د.ت</span></div>`).join('')}<div class="row total"><span>المجموع</span><span>${order.total} د.ت</span></div></div><p style="font-size:13px;color:var(--mute)">الدفع عند الاستلام.</p>`;}}
 else{
  if(book.done)m.innerHTML=`<h2>حجز طاولة</h2><div class="ok"><b>تم الحجز</b>${R.find(r=>r.id===book.rid).n}<br>${book.guests} أشخاص · ${book.date} · ${book.time}<br><br><button class="chip" id="again">حجز جديد</button></div>`;
  else m.innerHTML=`<h2>حجز طاولة</h2><label for="rs">المطعم</label><select id="rs">${R.map(r=>`<option value="${r.id}" ${r.id===book.rid?'selected':''}>${r.n}</option>`).join('')}</select><label for="d">التاريخ</label><input type="date" id="d" value="${book.date}"><label>الوقت</label><div class="times">${['12:00','13:00','14:00','19:00','20:00','21:00','22:00'].map(t=>`<button class="chip ${book.time===t?'on':''}" data-t2="${t}">${t}</button>`).join('')}</div><label>عدد الأشخاص</label><div class="guests"><button class="q add" id="gp" aria-label="زيد">+</button><b>${book.guests}</b><button class="q" id="gm" aria-label="نقص">−</button></div><div style="margin-top:24px"><button class="btn" id="bk" ${book.date&&book.time?'':'disabled'}>تأكيد الحجز</button></div>`;}
 const show=tab==='home'&&rid&&count()>0;$('#bar').classList.toggle('show',show);
 if(show)$('#go').textContent=`ثبت الطلب · ${count()} · ${sum()} د.ت`;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
// 6) place: تثبّت الطلب وتحاكي المراحل (تم الاستلام ← قيد التحضير ← جاهز) وبعدها تطلّع الإشعار
//    في التطبيق الحقيقي هذا الجزء يجي من السيرفر كي المطعم يضغط "جاهز"
function place(){timers.forEach(clearTimeout);const r=cur();
 const lines=r.m.map((i,x)=>cart[x]?[cart[x],i.n,cart[x]*i.p]:0).filter(Boolean);
 order={no:Math.floor(100+Math.random()*900),rn:r.n,lines,total:sum(),st:0};cart={};tab='order';render();
 timers=[setTimeout(()=>{order.st=1;if(tab==='order')render()},3500),setTimeout(()=>{order.st=2;if(tab==='order')render();const t=$('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),5000)},9000)];}
// 7) الضغطات: كل الأزرار (فتح مطعم، زيادة/نقصان كمية، تثبيت الطلب، الحجز...) تتعالج هنا
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.t){tab=d.t;if(tab==='home')rid=null}
 else if(d.r){if(rid!==d.r)cart={};rid=d.r}
 else if(d.back){rid=null;cart={};edit=false}
 else if(d.edit)edit=!edit;
 else if(d.a){cart[d.a]=(cart[d.a]||0)+1}
 else if(d.m){cart[d.m]--;if(!cart[d.m])delete cart[d.m]}
 else if(t.id==='go')return place();
 else if(d.t2)book.time=d.t2;
 else if(t.id==='gp')book.guests=Math.min(12,book.guests+1);
 else if(t.id==='gm')book.guests=Math.max(1,book.guests-1);
 else if(t.id==='bk')book.done=true;
 else if(t.id==='again')book={rid:book.rid,date:'',time:'',guests:2,done:false};
 else return;render();});
// 8) التغييرات: اختيار التاريخ، المطعم في الحجز، ورفع صورة
document.addEventListener('change',e=>{const f=e.target.dataset.k&&e.target.files[0];if(f)return shrink(f,e.target.dataset.k);if(e.target.id==='d'){book.date=e.target.value;render()}if(e.target.id==='rs'){book.rid=e.target.value}});
render();
</script>
